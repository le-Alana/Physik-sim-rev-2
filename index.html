<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physik Simulation - 3D Renderer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            font-size: 14px;
            font-family: monospace;
            z-index: 10;
            max-width: 400px;
        }
        
        #info h2 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        #info p {
            margin: 5px 0;
            line-height: 1.6;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 10;
        }
        
        #controls h3 {
            margin-bottom: 8px;
        }
        
        #controls p {
            margin: 3px 0;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="info">
        <h2>🚀 Physik Simulation</h2>
        <p><strong>Renderer:</strong> WebGPU + Three.js</p>
        <p><strong>FPS:</strong> <span id="fps">0</span></p>
        <p><strong>Triangles:</strong> <span id="triangles">0</span></p>
        <p><strong>Render Time:</strong> <span id="renderTime">0</span>ms</p>
        <p id="gpuInfo">Detecting GPU...</p>
    </div>
    
    <div id="controls">
        <h3>Controls</h3>
        <p>🖱️ Drag to rotate</p>
        <p>🔄 Scroll to zoom</p>
        <p>Spacebar to pause</p>
        <p>R to reset scene</p>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
