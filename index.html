<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ultra-realistic WebGPU 3D rendering engine - Rayman-style scene with volumetric clouds, PBR materials, SSR, and full post-processing">
  <title>Physik Sim - WebGPU 3D Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/": "/node_modules/three/",
      "three/webgpu": "/node_modules/three/build/three.webgpu.js",
      "three/webgl": "/node_modules/three/build/three.module.js",
      "three/examples/jsm/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-text {
      margin-top: 20px;
      color: #888;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    #stats {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #0f0;
      padding: 10px 15px;
      border-radius: 8px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 12px;
      z-index: 100;
      pointer-events: none;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #stats.hidden {
      display: none;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 4px 0;
    }
    .stats-label {
      color: #888;
    }
    .stats-value {
      color: #0f0;
      font-weight: bold;
    }
    @media (max-width: 768px) {
      #stats {
        bottom: 10px;
        right: 10px;
        left: 10px;
        font-size: 11px;
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="loader"></div>
    <div id="loading-text">Initializing WebGPU Engine...</div>
  </div>
  <div id="app"></div>
  <div id="stats" class="hidden" aria-hidden="true">
    <div class="stats-row">
      <span class="stats-label">FPS:</span>
      <span class="stats-value" id="stat-fps">--</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Frame:</span>
      <span class="stats-value" id="stat-frame">-- ms</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Draw Calls:</span>
      <span class="stats-value" id="stat-draw">--</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Triangles:</span>
      <span class="stats-value" id="stat-tris">--</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Memory:</span>
      <span class="stats-value" id="stat-mem">-- MB</span>
    </div>
    <div class="stats-row">
      <span class="stats-label">Renderer:</span>
      <span class="stats-value" id="stat-renderer">--</span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
