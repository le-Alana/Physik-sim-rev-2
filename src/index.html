<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<title>Physik Sim — WebGPU Rayman Scene</title>
	<style>
		/* ── Fullscreen canvas, no scroll ── */
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
		canvas { display: block; width: 100%; height: 100%; }

		/* ── HUD overlay for controls hint ── */
		#hud {
			position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
			color: rgba(255,255,255,0.6); font-family: 'Segoe UI', sans-serif;
			font-size: 14px; text-align: center; pointer-events: none;
			text-shadow: 0 0 12px rgba(0,0,0,0.8); user-select: none;
			background: rgba(0,0,0,0.3); padding: 8px 20px; border-radius: 20px;
			backdrop-filter: blur(4px);
		}
		#hud kbd {
			background: rgba(255,255,255,0.15); padding: 2px 8px; border-radius: 4px;
			font-family: inherit; border: 1px solid rgba(255,255,255,0.2);
		}
		@media (max-width: 600px) { #hud { font-size: 12px; padding: 6px 14px; } }
	</style>
</head>
<body>
	<!-- ── Canvas for WebGPU renderer ── -->
	<canvas id="renderCanvas"></canvas>

	<!-- HUD: controls hint -->
	<div id="hud">
		<kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> Move Cube
		&nbsp;·&nbsp; Mouse drag to orbit
	</div>

	<!-- ── Main entry module ── -->
	<script type="importmap">
	{
		"imports": {
		"three": "./node_modules/three/build/three.module.js",
		"three/webgpu": "./node_modules/three/build/three.webgpu.js",
		"three/tsl": "./node_modules/three/build/three.tsl.js",
		"three/addons/": "./node_modules/three/examples/jsm/"
		}
	}
	</script>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
